# Test every push and pull request; deploy master to Fly once the tests pass.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8 # keep in step with the Dockerfile
      - run: deno task test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than racing the running one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: the SQLite volume belongs to one machine, so there must only ever be one (see README).
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
